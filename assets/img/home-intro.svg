<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="STEM and creativity illustration for Aditya Kandukoori">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23395d"/>
      <stop offset="0.55" stop-color="#2f6b8f"/>
      <stop offset="1" stop-color="#28b6a0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="560" height="380" fill="url(#hero-bg)"/>
  <rect width="560" height="380" fill="url(#dots)"/>

  <!-- soft blobs -->
  <circle cx="470" cy="70" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="80" cy="320" r="90" fill="#ffffff" opacity="0.05"/>

  <!-- atom motif -->
  <g transform="translate(140 130)" stroke="#ffffff" stroke-opacity="0.6" fill="none" stroke-width="2.5">
    <ellipse rx="58" ry="22"/>
    <ellipse rx="58" ry="22" transform="rotate(60)"/>
    <ellipse rx="58" ry="22" transform="rotate(120)"/>
    <circle r="6" fill="#ffffff" stroke="none"/>
  </g>

  <!-- code brackets -->
  <text x="372" y="270" font-family="'Source Sans Pro', monospace" font-size="64" font-weight="700"
        fill="#ffffff" fill-opacity="0.85" text-anchor="middle">&#60;/&#62;</text>

  <!-- monogram + tagline -->
  <text x="280" y="312" font-family="'Source Sans Pro', Lato, Arial, sans-serif" font-size="34" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="3">ADITYA KANDUKOORI</text>
  <text x="280" y="344" font-family="Lato, Arial, sans-serif" font-size="16" font-weight="400"
        fill="#ffffff" fill-opacity="0.85" text-anchor="middle" letter-spacing="2">STEM &#183; Code &#183; Science &#183; Art</text>
</svg>
